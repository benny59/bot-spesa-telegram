<title>kWh ↔ %</title>
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--card:#fff;--mut:#64748b;--acc:#16a34a;--bd:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#f1f5f9;--card:#1e293b;--mut:#94a3b8;--acc:#4ade80;--bd:#334155}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px system-ui,sans-serif;padding:16px;max-width:480px;margin-inline:auto}
h1{font-size:1.2rem;margin:.5rem 0 1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;color:var(--mut);font-size:.85rem;margin-bottom:6px}
.row{display:flex;align-items:center;gap:8px}
input{width:100%;font-size:2rem;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--fg)}
.u{font-size:1.4rem;color:var(--mut);min-width:3ch}
.bar{height:22px;border-radius:11px;background:var(--bd);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.cap input{font-size:1rem;width:6ch;padding:4px 8px}
.cap{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:.9rem}
.quick{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:.9rem;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.radios{display:flex;gap:20px;margin-top:10px}
.radios label{display:flex;align-items:center;gap:6px;margin:0;font-size:1rem;color:var(--fg)}
.radios input{width:auto;font-size:1rem}
#off{font-size:1.6rem}
.tot{margin-top:14px;font-size:1.1rem}
.tot b{color:var(--acc);font-size:1.4rem}
</style>
</head>
<body>
<h1>🔋 Conversione kWh ↔ %</h1>
<div class="card">
  <label for="kwh">Energia</label>
  <div class="row"><input id="kwh" type="number" inputmode="decimal" step="any" min="0" placeholder="0"><span class="u">kWh</span></div>
  <div style="height:14px"></div>
  <label for="pct">Percentuale della batteria</label>
  <div class="row"><input id="pct" type="number" inputmode="decimal" step="any" min="0" placeholder="0"><span class="u">%</span></div>
  <div class="bar"><i id="bar"></i></div>
</div>
<div class="card">
  <label for="off">Offset</label>
  <div class="row"><input id="off" type="number" inputmode="decimal" step="any" placeholder="0">
    <button id="rst" type="button">Azzera</button></div>
  <div class="radios">
    <label><input type="radio" name="u" value="kwh" checked> kWh</label>
    <label><input type="radio" name="u" value="pct"> %</label>
  </div>
  <div class="tot">Totale: <b id="tkwh">0</b> kWh = <b id="tpct">0</b> %</div>
</div>
<div class="card">
  <label>Valori rapidi</label>
  <div class="quick" id="quick"></div>
</div>
<div class="cap">Capacità batteria: <input id="cap" type="number" inputmode="decimal" step="any" min="1" value="58"> kWh</div>
<script>
const $=id=>document.getElementById(id);
const kwh=$('kwh'),pct=$('pct'),cap=$('cap'),bar=$('bar');
try{const c=localStorage.getItem('cap');if(c)cap.value=c}catch(e){}
const C=()=>parseFloat(cap.value)||58;
const fmt=(n,d)=>String(+n.toFixed(d));
const off=$('off');
const unit=()=>document.querySelector('input[name=u]:checked').value;
function total(){
  const k=parseFloat(kwh.value)||0,o=parseFloat(off.value)||0;
  const ok=unit()==='pct'?o/100*C():o;
  const t=k+ok;
  $('tkwh').textContent=fmt(t,2);$('tpct').textContent=fmt(t/C()*100,1);
}
function bar_(p){bar.style.width=Math.max(0,Math.min(100,p))+'%';total()}
kwh.oninput=()=>{const v=parseFloat(kwh.value);if(isNaN(v)){pct.value='';bar_(0);return}const p=v/C()*100;pct.value=fmt(p,1);bar_(p)};
pct.oninput=()=>{const v=parseFloat(pct.value);if(isNaN(v)){kwh.value='';bar_(0);return}kwh.value=fmt(v/100*C(),2);bar_(v)};
cap.oninput=()=>{try{localStorage.setItem('cap',cap.value)}catch(e){}buildQuick();kwh.value?kwh.oninput():pct.oninput()};
function buildQuick(){const q=$('quick');q.innerHTML='';[10,20,30,50,80,100].forEach(p=>{const b=document.createElement('button');b.textContent=p+'% = '+fmt(p/100*C(),1)+' kWh';b.onclick=()=>{pct.value=p;pct.oninput()};q.appendChild(b)})}
off.oninput=total;
document.querySelectorAll('input[name=u]').forEach(r=>r.onchange=total);
$('rst').onclick=()=>{off.value='';total()};
buildQuick();total();
</script>
</body>
</html>
